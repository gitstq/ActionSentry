[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "actionsentry"
version = "1.0.0"
description = "A lightweight GitHub Actions workflow security static analysis engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ActionSentry Contributors"},
]
keywords = ["github-actions", "security", "sast", "ci-cd", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
actionsentry = "actionsentry.cli:main"

[tool.setuptools]
packages = ["actionsentry", "actionsentry.rules", "actionsentry.formatters"]
