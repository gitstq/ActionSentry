# EXE-001: Dangerous Script Execution
name: Dangerous Script Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const input = "${{ github.event.inputs.user_input }}";
            github.rest.repos.createRelease({ owner, repo, tag_name: input });
