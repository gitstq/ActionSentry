# SHL-001: Shell Issues
name: Shell Issues Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Eval usage
        run: eval "${{ github.event.inputs.command }}"
      - name: Curl pipe
        run: curl https://example.com/script.sh | bash
      - name: chmod 777
        run: chmod 777 /tmp/build
